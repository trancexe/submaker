[project]
name = "submaker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "trancexe", email = "trancexe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "deep-translator>=1.11.4",
    "fastapi>=0.143.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pysubs2>=1.9.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
submaker = "submaker:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
